# 把本机 llama.cpp 上的 Ternary Bonsai 2.5 27B 注册成 DSH 的 Local Model provider。
# 端点走 bonsai 代理 (127.0.0.1:8123)：模型按需加载、空闲自动卸载。
- id: dsh-local-model
  name: dsh-local-model
  config:
    api: openai
    baseURL: http://127.0.0.1:8123/v1
    apiKey: ""
    defaultModel: bonsai-2.5-27b
    contextWindow: 32768
    maxTokens: 8192
    temperature: 0.7
    streamIdleTimeoutMs: 600000
    models:
      - id: bonsai-2.5-27b
        name: Bonsai 2.5 27B (local Metal)
        contextWindow: 32768
        maxTokens: 8192
